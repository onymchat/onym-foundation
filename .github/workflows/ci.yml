name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - name: Build contract pages from pinned commits
        run: npm run build
      - name: Internal links and anchors
        run: npm run check:links
      - name: HTML validation
        run: npm run check:html
      - name: Unit + browser + accessibility tests
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
